<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração — LUME</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/community.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/interactions.css">
</head>
<body>

  <header class="nav" id="nav">
    <a href="/" class="nav__logo" aria-label="LUME, início">LUME</a>
    <nav class="nav__links" id="navLinks" aria-label="Principal" hidden></nav>
    <button class="nav__toggle" id="navToggle" aria-controls="navLinks" hidden disabled aria-label="Abrir menu" aria-expanded="false"><span></span><span></span></button>
  </header>

  <main class="page" id="app" hidden>
    <div class="page-head" style="padding-bottom:32px">
      <span class="section-head__index">Curadoria</span>
      <h1 class="page-title">Administração</h1>
      <p class="page-sub"><a class="link-arrow" href="/comunidade#gestao">Gerir histórias e destaques e encontros</a></p>
    </div>

    <div class="admin-stats">
      <div><span class="stat__n" id="sPending">–</span><span class="stat__l">Em fila</span></div>
      <div><span class="stat__n" id="sApproved">–</span><span class="stat__l">Publicadas</span></div>
      <div><span class="stat__n" id="sRejected">–</span><span class="stat__l">Rejeitadas</span></div>
      <div><span class="stat__n" id="sUsers">–</span><span class="stat__l">Membros</span></div>
    </div>

    <div class="wrap">
      <div class="tabs admin-tabs" role="tablist" style="margin-top:0">
        <button class="tab is-active" role="tab" data-tab="fila" aria-selected="true">Fila <small id="tPending"></small></button>
        <button class="tab" role="tab" data-tab="semana" aria-selected="false">Foto da Semana</button>
        <button class="tab" role="tab" data-tab="publicadas" aria-selected="false">Publicadas</button>
        <button class="tab" role="tab" data-tab="rejeitadas" aria-selected="false">Rejeitadas</button>
      </div>
    </div>

    <section id="view"></section>
  </main>

  <div class="not-found" id="denied" hidden>
    <div>
      <h1 class="page-title">Página não encontrada</h1>
      <p style="margin-top:28px"><a class="btn" href="/">Voltar ao início</a></p>
    </div>
  </div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
